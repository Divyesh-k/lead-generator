<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Machines — NexLead</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/app-shell.css">
    <link rel="icon" type="image/png" href="/images/favicon-32.png">
    <link rel="apple-touch-icon" href="/images/favicon-180.png">
    <script src="/js/theme.js"></script>
    <style>
        .search-machines-bar {
            margin-bottom: 1.25rem;
            max-width: 420px;
        }

        .search-results-count {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 0.85rem;
        }
    </style>
</head>
<body data-page="search-machines" data-title="Search Machines" data-desc="Find and toggle machines by name">
    <div class="app-shell">
        <main class="app-main" id="appMain">
            <div class="app-content" id="appContent">

                <div class="section-header">
                    <div>
                        <h2>Search Machines</h2>
                        <p class="section-subtitle">Search across all your machines by name.</p>
                    </div>
                </div>

                <div class="search-bar search-machines-bar">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" id="searchInput" class="input" placeholder="Search machines by name...">
                </div>

                <p class="search-results-count" id="resultsCount"></p>

                <div id="resultsWrap"></div>

            </div>
        </main>
    </div>

    <script src="/js/icons.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/app-shell.js"></script>
    <script src="/js/search-machines.js"></script>
</body>
</html>
