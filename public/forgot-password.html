<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — NexLead</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="icon" type="image/png" href="/images/favicon-32.png">
    <link rel="apple-touch-icon" href="/images/favicon-180.png">
    <script src="/js/theme.js"></script>
    <style>
        .simple-auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-md);
            position: relative;
        }

        .simple-auth-page .theme-toggle {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
        }

        .simple-auth-card {
            max-width: 420px;
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: var(--shadow-lg);
        }

        .simple-auth-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .simple-auth-header {
            text-align: center;
            margin-bottom: var(--spacing-lg);
        }

        .simple-auth-header h1 {
            font-size: 1.4rem;
            margin-bottom: 0.4rem;
        }

        .simple-auth-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .reset-link-box {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.75rem 1rem;
            font-family: var(--font-mono);
            font-size: 0.78rem;
            word-break: break-all;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-sm);
        }

        .demo-note {
            background: hsla(38, 92%, 45%, 0.1);
            border: 1px solid var(--warning);
            color: var(--warning);
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            margin-bottom: var(--spacing-md);
        }

        .simple-auth-footnote {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: var(--spacing-md);
        }

        .simple-auth-footnote a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .simple-auth-footnote a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="simple-auth-page">
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
            <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>

        <div class="simple-auth-card">
            <div class="simple-auth-logo">
                <span class="brand-logo-swap">
                    <img src="/images/nexlead-logo.png" alt="NexLead" class="brand-logo-img brand-logo-light">
                    <img src="/images/nexlead-logo-dark.png" alt="NexLead" class="brand-logo-img brand-logo-dark">
                </span>
            </div>

            <div class="simple-auth-header">
                <h1>Forgot your password?</h1>
                <p>Enter your account email and we'll generate a reset link.</p>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <div id="resetLinkResult" class="hidden">
                <div class="demo-note">No email service is configured in this environment, so here's your reset link directly instead of an email:</div>
                <div class="reset-link-box" id="resetLinkText"></div>
                <a href="#" id="openResetLinkBtn" class="btn btn-primary" style="width:100%;">Open Reset Link</a>
            </div>

            <form id="forgotPasswordForm">
                <div class="input-group">
                    <label for="forgotEmail">Email Address</label>
                    <input type="email" id="forgotEmail" class="input" placeholder="you@example.com" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <span id="forgotBtnText">Send Reset Link</span>
                    <div id="forgotSpinner" class="spinner hidden" style="width:20px;height:20px;border-width:2px;margin:0 auto;"></div>
                </button>
            </form>

            <p class="simple-auth-footnote">Remembered it? <a href="/auth.html">Back to login</a></p>
        </div>
    </div>

    <script src="/js/icons.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/forgot-password.js"></script>
</body>
</html>
